# Google Drive virtual node — on-demand KG virtualization of the connected user's Drive,
# mirroring the GitHub issue/PR pattern (specs/VIRTUAL_CYPHER.md). A file materializes only
# when a query traverses to it from the current user, transiently, then rolls back — nothing
# is persisted.
#
# Reach it ONLY from (me:AssistantUser)-[:HAS_DRIVE_FILE]->(f:GoogleDriveFile). The anchor is
# the AssistantUser (NOT an arbitrary Person): Drive's files.list returns only the
# AUTHENTICATED user's own + shared-with-them files, so "my Drive" is the only meaningful
# anchor. Anchoring on AssistantUser also makes the join unreachable from (p:Person), which
# would otherwise imply we could list someone else's Drive.
#
#   MATCH (me:AssistantUser)-[:HAS_DRIVE_FILE]->(f:GoogleDriveFile)
#   WHERE f.mimeType = 'application/vnd.google-apps.spreadsheet'
#   RETURN count(f)                       # "how many Google Sheets do I have"
- name: GoogleDriveFile
  visibility: internal
  userAnchor: false
  description: >-
    A file in the connected user's Google Drive (Sheets, Docs, Slides, PDFs, folders, …),
    fetched on demand. Reach ONLY via (me:AssistantUser)-[:HAS_DRIVE_FILE]->(f:GoogleDriveFile).
    Filter by mimeType: a Google Sheet = 'application/vnd.google-apps.spreadsheet',
    a Doc = 'application/vnd.google-apps.document',
    Slides = 'application/vnd.google-apps.presentation',
    a folder = 'application/vnd.google-apps.folder'.
  virtualJoins:
    - anchorLabel: AssistantUser
      relationship: HAS_DRIVE_FILE
      keyField: id                 # AssistantUser.id — pins the fetch to the current user
      recordKeyField: ownerUserId  # echoed onto every file record by the producer (see below)
      producer: driveFiles
      description: >-
        the current user's Google Drive files ("my sheets / docs / files"); anchor on
        (me:AssistantUser). ALWAYS narrow with a filter the source can push: name CONTAINS,
        mimeType =, and modifiedTime/createdTime compared to an ISO-8601 STRING LITERAL (e.g.
        f.modifiedTime > '2026-06-15T00:00:00' for "last 2 weeks" — a literal date, NOT datetime()
        arithmetic, so it pushes to the source). For "shared with me" add f.ownedByMe = false; for
        "my own / files I own" use f.ownedByMe = true. For "WHO shared the MOST <files> with me"
        stay on THIS anchor (me:AssistantUser), filter f.ownedByMe = false, then
        WITH f.sharedByName AS person, count(f) AS n RETURN person, n ORDER BY n DESC — one list call,
        grouped graph-side; do NOT iterate (p:Person)-[:OWNS_DRIVE_FILE] per person.
    # Files OWNED BY A NAMED PERSON that are visible to you = "shared with me BY <person>". Anchor on a
    # (p:Person) narrowed by name, and the person's email scopes the source (`'<email>' in owners`):
    #   MATCH (p:Person)-[:OWNS_DRIVE_FILE]->(f:GoogleDriveFile)
    #   WHERE toLower(p.name) CONTAINS '<name>' AND f.mimeType = 'application/vnd.google-apps.document'
    - anchorLabel: Person
      relationship: OWNS_DRIVE_FILE
      keyField: primaryEmail       # the owner Person's email — rendered into Drive `'<email>' in owners`
      recordKeyField: ownerEmail   # echoed by the producer, maps each file back to its owner Person
      producer: driveFilesByOwner
      description: >-
        files OWNED BY this person that are visible to you — i.e. "shared with me BY <person>".
        Anchor on a (p:Person) narrowed by name (toLower(p.name) CONTAINS '…'); combine with a
        mimeType / date / name filter on the file as usual.
    # CONTENT relevance over LIVE Drive — files whose CONTENT mentions a free-text term (Drive's own
    # fullText search; nothing ingested/copied). Anchor a query-literal Concept and pin via:'keyword':
    #   MATCH (:Concept {value:'budget'})-[:RELEVANT_TO {via:'keyword'}]->(f:GoogleDriveFile)
    #   RETURN f.name, f.webViewLink
    - anchorLabel: Concept
      relationship: RELEVANT_TO
      via: keyword
      keyField: value
      recordKeyField: matchedFor
      producer: driveContentKeyword
      description: >-
        LEXICAL content relevance over LIVE Drive — files whose CONTENT mentions the free-text term
        (Drive fullText, live search, nothing stored). Seed a (:Concept {value:'…'}) and pin
        via:'keyword' on the edge. Name/date/type filters go on f as usual. Per-match data is on the
        EDGE: r.mode='keyword', r.rank (Drive's own order). For deep questions ABOUT a file's content,
        ingest it (drive_ingest) and use the Document RELEVANT_TO paths instead.
  properties:
    id:
      description: "Google Drive file id — identity."
      metadata:
        identity: "true"
    name: "File name / title."
    mimeType: "Google MIME type. Sheet='application/vnd.google-apps.spreadsheet', Doc='application/vnd.google-apps.document', Slides='application/vnd.google-apps.presentation', folder='application/vnd.google-apps.folder'."
    webViewLink: "URL to open the file in a browser."
    modifiedTime: "ISO-8601 last-modified. For a date window compare to a STRING LITERAL, e.g. modifiedTime > '2026-06-15T00:00:00'."
    createdTime: "ISO-8601 creation timestamp (compare to a string literal)."
    ownedByMe: "Boolean — true if the user OWNS the file, false if it was SHARED WITH them. Filter `f.ownedByMe = false` for 'shared with me', `f.ownedByMe = true` for 'my own'."
    ownerEmail: "Email of the owning person, when reached via (Person)-[:OWNS_DRIVE_FILE]->(file)."
    sharedByEmail: "Email of the person who OWNS/shared this file (present on the (me:AssistantUser)-[:HAS_DRIVE_FILE] path). For 'who shared the MOST <files> with me' filter f.ownedByMe = false then GROUP BY f.sharedByName / f.sharedByEmail and ORDER BY count(f) DESC — one list call, NO per-person iteration."
    sharedByName: "Display name of the person who owns/shared this file. GROUP BY this for 'who shared the most with me'."
  # FEW-SHOT for the text-to-cypher generator (lens path). Phrased to teach the PATTERN/CLASS, NOT to
  # mirror any specific question — neutral synthetic topics, no real names/files/folders.
  examples:
    # POSITIVE — ai_relevant is a per-row LLM FILTER over the FETCHED files: after the pushable predicate
    # (mimeType) bounds the fetch, keep only files a subjective test judges on target — a discriminator no
    # mimeType/name/date captures. Composes with real predicates via AND. `ai_` is a reserved query
    # primitive, never a stored file property.
    - q: "my Google Docs that are genuinely about the quarterly board deck, not just anything that mentions the quarter"
      cypher: |
        MATCH (me:AssistantUser)-[:HAS_DRIVE_FILE]->(f:GoogleDriveFile)
        WHERE f.mimeType = 'application/vnd.google-apps.document'
          AND f.ai_relevant = 'genuinely about the quarterly board deck, not merely mentioning the quarter in passing'
        RETURN f.name, f.webViewLink ORDER BY f.modifiedTime DESC LIMIT 50
    # POSITIVE — ai_score(f, '<criterion>') is a per-row LLM RERANK over the fetched files; pair it with
    # LIMIT k for top-k by fit when no scalar (modifiedTime, name) captures "how relevant". The name
    # CONTAINS predicate still bounds the fetch (requiresFilter), then the LLM reranks what came back.
    - q: "the handful of my Drive files most relevant to the website redesign"
      cypher: |
        MATCH (me:AssistantUser)-[:HAS_DRIVE_FILE]->(f:GoogleDriveFile)
        WHERE f.name CONTAINS 'design'
        RETURN f.name, f.webViewLink
        ORDER BY ai_score(f, 'relevance to the ongoing website redesign project') DESC LIMIT 5
