# Virtual-join producers for the Google pack (see specs/VIRTUAL_CYPHER.md). A RemoteRepository
# is a keyed reader over an external store, in the Spring Data sense.

# driveFiles — the connected user's Google Drive files, for the GoogleDriveFile virtual node.
#
# LIST-FOR-ME, NOT per-key: files.list returns the AUTHENTICATED user's files (the OAuth token
# identifies the user). The anchor key (AssistantUser.id) is therefore NOT injected into the
# call — there is no keyArg/keyTemplate/keyArgs. Instead `echoKeyAs: ownerUserId` stamps the
# current-user id onto every returned record, so all files (including ones shared WITH the user,
# which the user doesn't own) map back to the single (me:AssistantUser) anchor via the join's
# recordKeyField: ownerUserId.
#
# NEVER FETCH ALL. A real Drive can hold tens of thousands of files; enumerating them is never the
# right answer (and the page cap would silently truncate it). So:
#   - PUSHDOWN scopes the fetch AT THE SOURCE: `name CONTAINS 'x'` becomes Drive's `name contains
#     'x'`, `mimeType = '…'` becomes `mimeType = '…'`, substituted into `q` via `{filters}`. Drive
#     joins clauses with ` and `, so each qualifier carries its own leading " and " to compose onto
#     the base `trashed = false`. Most-specific filter first → few records, fast, never near the cap.
#   - requiresFilter: true means a query with NO pushable predicate (e.g. "all my files") is NOT
#     run — the engine returns an honest NEEDS_FILTER note ("narrow it"), not a truncated guess.
# Whatever isn't pushed (a 2nd name token, case-folding) still filters graph-side after materialize.
- name: driveFiles
  kind: remote
  operation: files/list            # GET /files
  records: "$.files[*]"
  args:
    q: "trashed = false{filters}"
    fields: "files(id,name,mimeType,webViewLink,modifiedTime,createdTime,sharedWithMe),nextPageToken"
    orderBy: "modifiedTime desc"
    spaces: drive
  echoKeyAs: ownerUserId           # stamp the anchor (current-user id) onto each file record
  requiresFilter: true             # never enumerate the whole Drive — demand a pushable predicate
  pushdown:
    - property: name               # f.name CONTAINS 'x'  →  Drive  name contains 'x'  (case-insensitive)
      op: CONTAINS
      qualifier: " and name contains '{value}'"
    - property: mimeType           # f.mimeType = '…'     →  Drive  mimeType = '…'
      op: EQUALS
      qualifier: " and mimeType = '{value}'"
    - property: sharedWithMe       # f.sharedWithMe = true  →  Drive  sharedWithMe = true  ("shared with me")
      op: EQUALS
      qualifier: " and sharedWithMe = {value}"
    - property: modifiedTime       # date window → Drive modifiedTime range (compare to ISO string literal)
      op: GREATER_THAN
      qualifier: " and modifiedTime > '{value}'"
    - property: modifiedTime
      op: GREATER_THAN_OR_EQUAL
      qualifier: " and modifiedTime >= '{value}'"
    - property: modifiedTime
      op: LESS_THAN
      qualifier: " and modifiedTime < '{value}'"
    - property: modifiedTime
      op: LESS_THAN_OR_EQUAL
      qualifier: " and modifiedTime <= '{value}'"
    - property: createdTime
      op: GREATER_THAN
      qualifier: " and createdTime > '{value}'"
    - property: createdTime
      op: LESS_THAN
      qualifier: " and createdTime < '{value}'"
  paging:
    style: cursor
    cursorParam: pageToken
    cursorPath: "$.nextPageToken"
    sizeParam: pageSize
    size: 1000
    maxPages: 10
  cost:
    bucket: google
    rate: 100/100s
    batch: true                    # one scoped list call serves the single current-user anchor
  cache:
    kind: ttl
    seconds: 300
