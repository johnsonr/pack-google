# Virtual-join producers for the Google pack (see specs/VIRTUAL_CYPHER.md). A RemoteRepository
# is a keyed reader over an external store, in the Spring Data sense.

# driveFiles — the connected user's Google Drive files, for the GoogleDriveFile virtual node.
#
# LIST-FOR-ME, NOT per-key: files.list returns the AUTHENTICATED user's files (the OAuth token
# identifies the user). The anchor key (AssistantUser.id) is therefore NOT injected into the
# call — there is no keyArg/keyTemplate/keyArgs. Instead `echoKeyAs: ownerUserId` stamps the
# current-user id onto every returned record, so all files (including ones shared WITH the user,
# which the user doesn't own) map back to the single (me:AssistantUser) anchor via the join's
# recordKeyField: ownerUserId.
#
# NEVER FETCH ALL. A real Drive can hold tens of thousands of files; enumerating them is never the
# right answer (and the page cap would silently truncate it). So:
#   - PUSHDOWN scopes the fetch AT THE SOURCE: `name CONTAINS 'x'` becomes Drive's `name contains
#     'x'`, `mimeType = '…'` becomes `mimeType = '…'`, substituted into `q` via `{filters}`. Drive
#     joins clauses with ` and `, so each qualifier carries its own leading " and " to compose onto
#     the base `trashed = false`. Most-specific filter first → few records, fast, never near the cap.
#   - requiresFilter: true means a query with NO pushable predicate (e.g. "all my files") is NOT
#     run — the engine returns an honest NEEDS_FILTER note ("narrow it"), not a truncated guess.
# Whatever isn't pushed (a 2nd name token, case-folding) still filters graph-side after materialize.
- name: driveFiles
  kind: remote
  operation: files/list            # GET /files
  records: "$.files[*]"
  args:
    q: "trashed = false{filters}"
    # NOTE: `ownedByMe` is the real Drive File boolean field. `sharedWithMe` is a Drive *query term*
    # (valid in q) but NOT a selectable field — requesting it in `fields` 400s. So we materialise
    # `ownedByMe` and express "shared with me" as `ownedByMe = false` graph-side.
    fields: "files(id,name,mimeType,webViewLink,modifiedTime,createdTime,ownedByMe,owners(emailAddress,displayName)),nextPageToken"
    orderBy: "modifiedTime desc"
    spaces: drive
  echoKeyAs: ownerUserId           # stamp the anchor (current-user id) onto each file record
  project:                         # Drive `owners` is an array; lift the owner scalar so "who shared the
    sharedByEmail: owners.0.emailAddress   # most with me" GROUPs by owner from the ONE list call (no per-person fan-out)
    sharedByName: owners.0.displayName
  requiresFilter: true             # never enumerate the whole Drive — demand a pushable predicate
  pushdown:
    - property: name               # f.name CONTAINS 'x'  →  Drive  name contains 'x'  (case-insensitive)
      op: CONTAINS
      qualifier: " and name contains '{value}'"
    - property: mimeType           # f.mimeType = '…'     →  Drive  mimeType = '…'
      op: EQUALS
      qualifier: " and mimeType = '{value}'"
    # "shared with me" filters f.ownedByMe = false GRAPH-SIDE (ownedByMe is materialised); the fetch is
    # bounded by the OTHER pushed filters (type / date / name). No source pushdown for it: the q term is
    # `sharedWithMe` but the boolean we can read back is `ownedByMe`, and a value-inverting push isn't
    # expressible — graph-side on the materialised field is correct and the fetch is already scoped.
    - property: modifiedTime       # date window → Drive modifiedTime range (compare to ISO string literal)
      op: GREATER_THAN
      qualifier: " and modifiedTime > '{value}'"
    - property: modifiedTime
      op: GREATER_THAN_OR_EQUAL
      qualifier: " and modifiedTime >= '{value}'"
    - property: modifiedTime
      op: LESS_THAN
      qualifier: " and modifiedTime < '{value}'"
    - property: modifiedTime
      op: LESS_THAN_OR_EQUAL
      qualifier: " and modifiedTime <= '{value}'"
    - property: createdTime
      op: GREATER_THAN
      qualifier: " and createdTime > '{value}'"
    - property: createdTime
      op: LESS_THAN
      qualifier: " and createdTime < '{value}'"
  paging:
    style: cursor
    cursorParam: pageToken
    cursorPath: "$.nextPageToken"
    sizeParam: pageSize
    size: 1000
    maxPages: 10
  cost:
    bucket: google
    rate: 100/100s
    batch: true                    # one scoped list call serves the single current-user anchor
  cache:
    kind: ttl
    seconds: 300

# driveFilesByOwner — files OWNED BY A NAMED PERSON that are visible to the connected user
# (i.e. "shared with me by <person>"), for the (p:Person)-[:OWNS_DRIVE_FILE]->(f:GoogleDriveFile) join.
#
# The OWNER'S EMAIL scopes the source: each anchor Person's email is rendered into Drive's `q` as
# `'<email>' in owners` via keyTemplate. files.list still runs with the CONNECTED user's token, so it
# returns only that owner's files the user can actually see — exactly "shared with me by them". The key
# DOES scope the source, so no requiresFilter is needed (the owner clause bounds the fetch). echoKeyAs
# stamps the queried owner email back onto each record (and forces one-email-per-call), so files map to
# the right Person anchor via recordKeyField: ownerEmail. mimeType / name / date still push via {filters}.
- name: driveFilesByOwner
  kind: remote
  operation: files/list
  records: "$.files[*]"
  args:
    q: "trashed = false and {keys}{filters}"
    fields: "files(id,name,mimeType,webViewLink,modifiedTime,createdTime,ownedByMe),nextPageToken"
    orderBy: "modifiedTime desc"
    spaces: drive
  keyTemplate: "'{key}' in owners"   # owner email → Drive owner filter (scopes the source)
  echoKeyAs: ownerEmail              # stamp the queried owner email onto each record (one email per call)
  pushdown:
    - property: name
      op: CONTAINS
      qualifier: " and name contains '{value}'"
    - property: mimeType
      op: EQUALS
      qualifier: " and mimeType = '{value}'"
    - property: modifiedTime
      op: GREATER_THAN
      qualifier: " and modifiedTime > '{value}'"
    - property: modifiedTime
      op: LESS_THAN
      qualifier: " and modifiedTime < '{value}'"
    - property: createdTime
      op: GREATER_THAN
      qualifier: " and createdTime > '{value}'"
    - property: createdTime
      op: LESS_THAN
      qualifier: " and createdTime < '{value}'"
  paging:
    style: cursor
    cursorParam: pageToken
    cursorPath: "$.nextPageToken"
    sizeParam: pageSize
    size: 1000
    maxPages: 10
  cost:
    bucket: google
    rate: 100/100s
    batch: false                   # one owner email per call (echoKeyAs)
  cache:
    kind: ttl
    seconds: 300

# driveContentKeyword — LEXICAL content relevance over LIVE Drive (kind: remote-search, spec
# EXTERNAL_DOCUMENTS.md lane 1). Backs Concept -[:RELEVANT_TO {via:'keyword'}]-> GoogleDriveFile:
# per anchor Concept the engine substitutes the free text into `{query}` (quotes escaped) and runs
# Drive's own fullText search — a live keyword search, nothing ingested. k bounds hits per anchor;
# per-match r.mode='keyword' / r.rank land on the edge. Content SEMANTICS (vector/agentic) need the
# file INGESTED (drive_ingest) — this join is the honest lexical "mentions" over the live store.
- name: driveContentKeyword
  kind: remote-search
  operation: files/list
  args:
    q: "trashed = false and fullText contains '{query}'"
    fields: "files(id,name,mimeType,webViewLink,modifiedTime,createdTime,ownedByMe),nextPageToken"
    orderBy: "modifiedTime desc"
    spaces: drive
    pageSize: 25
  records: "$.files[*]"
  k: 8
